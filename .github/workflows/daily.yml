name: Daily Discount Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"
      timezone: "Asia/Tbilisi"

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discount tracker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USER_HEIGHT_CM: ${{ secrets.USER_HEIGHT_CM }}
          USER_CHEST_CM: ${{ secrets.USER_CHEST_CM }}
          USER_WAIST_CM: ${{ secrets.USER_WAIST_CM }}
          USER_HIPS_CM: ${{ secrets.USER_HIPS_CM }}
          USER_CLOTHING_SIZE: ${{ secrets.USER_CLOTHING_SIZE }}
          USER_PREFERRED_FIT: ${{ secrets.USER_PREFERRED_FIT }}
        run: python main.py
